name: Update gold page

# Runs on a schedule with nobody watching. This is the bit that makes the
# site update "on its own" for real - GitHub's servers do the work, so
# nothing on your side has to stay switched on.
on:
  schedule:
    # Every 15 minutes. GitHub queues cron jobs, so expect 15-25 min in practice.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # lets you press "Run workflow" by hand
  push:
    branches: [main]

permissions:
  contents: write           # needed to commit the rebuilt page

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests flask

      - name: Build the page
        run: python3 build_site.py

      - name: Commit if anything changed
        run: |
          git config user.name  "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "no change this run"
          else
            git commit -m "update: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
